name: B1-2 Runtime Cases

on:
  push:
    branches:
      - mission/B1-2
    paths:
      - scripts/run_runtime_cases.sh
      - scripts/monitor.sh
      - .github/workflows/b1-2-runtime-cases.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-cases:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify non-root runner and execute bounded cases
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$(id -un) uid=$(id -u)"
          test "$(id -u)" -ne 0
          bash -n scripts/monitor.sh
          bash -n scripts/run_runtime_cases.sh
          bash scripts/run_runtime_cases.sh

      - name: Summarize evidence
        if: always()
        shell: bash
        run: |
          set -u
          echo "=== B1-2 runtime evidence summaries ==="
          find runtime-case-evidence -name case-summary.log -print -exec sh -c 'echo; cat "$1"; echo' _ {} \; 2>/dev/null || true

      - name: Upload runtime case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-runtime-cases
          path: runtime-case-evidence/
          if-no-files-found: warn
          retention-days: 7
