name: B1-2 Runtime Inspect

on:
  push:
    branches:
      - mission/B1-2
    paths:
      - agent-app-leak.zip
      - .github/workflows/b1-2-runtime-inspect.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect archive without executing binaries
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "=== runner ==="
            uname -a
            echo
            echo "=== archive ==="
            ls -lh agent-app-leak.zip
            sha256sum agent-app-leak.zip
            echo
            echo "=== zip listing ==="
            unzip -l agent-app-leak.zip
            echo
            echo "=== extracted file metadata ==="
            rm -rf /tmp/b1-2-inspect
            mkdir -p /tmp/b1-2-inspect
            unzip -q agent-app-leak.zip -d /tmp/b1-2-inspect
            find /tmp/b1-2-inspect -maxdepth 3 -type f -print -exec file {} \;
          } | tee runtime-inspect.txt

      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-runtime-inspect
          path: runtime-inspect.txt
          if-no-files-found: error
          retention-days: 7
