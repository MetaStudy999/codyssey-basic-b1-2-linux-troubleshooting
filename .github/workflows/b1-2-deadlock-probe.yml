name: B1-2 Deadlock Probe

on:
  push:
    branches:
      - mission/B1-2
    paths:
      - scripts/run_deadlock_probe.sh
      - .github/workflows/b1-2-deadlock-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deadlock-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run bounded comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          bash -n scripts/run_deadlock_probe.sh
          B1_2_DEADLOCK_SECONDS=55 bash scripts/run_deadlock_probe.sh
      - name: Print summaries
        if: always()
        shell: bash
        run: |
          set -u
          for f in deadlock-probe-evidence/*/summary.log; do
            echo "===== $f ====="
            cat "$f"
          done
          echo '===== lock/wait keyword scan ====='
          grep -RniE 'WAITING|BLOCKED|deadlock|lock|wchan|futex' deadlock-probe-evidence || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-deadlock-probe
          path: deadlock-probe-evidence/
          if-no-files-found: warn
          retention-days: 7
