name: B1-2 CPU Probe

on:
  push:
    branches:
      - mission/B1-2
    paths:
      - scripts/run_cpu_probe.sh
      - .github/workflows/b1-2-cpu-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run bounded comparison
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          bash -n scripts/run_cpu_probe.sh
          B1_2_CPU_SECONDS=42 bash scripts/run_cpu_probe.sh
      - name: Print summaries
        if: always()
        shell: bash
        run: |
          set -u
          find cpu-probe-evidence -name summary.log -print -exec sh -c 'echo; cat "$1"; echo' _ {} \; 2>/dev/null || true
          echo '===== highest visible supplied-app CPU rows ====='
          grep -Rh 'agent-leak-app-x86' cpu-probe-evidence/*/process-snapshots.log 2>/dev/null | head -n 100 || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-cpu-probe
          path: cpu-probe-evidence/
          if-no-files-found: warn
          retention-days: 7
