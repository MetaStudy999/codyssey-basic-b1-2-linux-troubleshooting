name: B1-2 CPU Interval Evidence

on:
  push:
    branches:
      - mission/B1-2
    paths:
      - scripts/cpu_interval_sampler.py
      - .github/workflows/b1-2-cpu-interval.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-interval:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run CPU 90 interval telemetry
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          rm -rf /tmp/b1-2-cpu-interval cpu-interval-evidence
          mkdir -p /tmp/b1-2-cpu-interval/bin cpu-interval-evidence
          unzip -q agent-app-leak.zip -d /tmp/b1-2-cpu-interval/bin
          BIN=/tmp/b1-2-cpu-interval/bin/agent-leak-app-x86
          chmod +x "$BIN"
          HOME_DIR=/tmp/b1-2-cpu-interval/home
          mkdir -p "$HOME_DIR/upload_files" "$HOME_DIR/api_keys" cpu-interval-evidence/log
          printf 'agent_api_key_test\n' > "$HOME_DIR/api_keys/secret.key"
          setsid env AGENT_HOME="$HOME_DIR" AGENT_PORT=15034 \
            AGENT_UPLOAD_DIR="$HOME_DIR/upload_files" AGENT_KEY_PATH="$HOME_DIR/api_keys" \
            AGENT_LOG_DIR="$PWD/cpu-interval-evidence/log" MEMORY_LIMIT=512 \
            CPU_MAX_OCCUPY=90 MULTI_THREAD_ENABLE=false \
            "$BIN" >cpu-interval-evidence/app.stdout.log 2>&1 &
          LEADER=$!
          echo "leader_pgid=$LEADER" | tee cpu-interval-evidence/summary.log
          python3 scripts/cpu_interval_sampler.py "$LEADER" 38 0.25 | tee cpu-interval-evidence/cpu-interval.csv
          set +e
          wait "$LEADER"
          RC=$?
          set -e
          echo "launcher_exit_code=$RC" | tee -a cpu-interval-evidence/summary.log
          echo '--- max CPU samples by process ---' | tee -a cpu-interval-evidence/summary.log
          python3 - <<'PY' | tee -a cpu-interval-evidence/summary.log
          import csv
          from collections import defaultdict
          rows=defaultdict(list)
          with open('cpu-interval-evidence/cpu-interval.csv', newline='') as f:
              for r in csv.DictReader(f):
                  rows[(r['pid'], r['comm'])].append(float(r['cpu_percent']))
          for (pid,comm), vals in sorted(rows.items(), key=lambda x:max(x[1]), reverse=True):
              print(f'pid={pid} comm={comm} max_interval_cpu={max(vals):.2f}% samples={len(vals)}')
          PY
          echo '--- application CPU lines ---' | tee -a cpu-interval-evidence/summary.log
          grep -E 'CpuWorker|CPU Threshold|Agent READY' cpu-interval-evidence/app.stdout.log | tee -a cpu-interval-evidence/summary.log || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-2-cpu-interval
          path: cpu-interval-evidence/
          if-no-files-found: warn
          retention-days: 7
